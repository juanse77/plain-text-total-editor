apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"


def CFG        = rootProject.ext
def COMPILE_SDK= CFG.has('compileSdkVersion') ? (CFG.compileSdkVersion as int) : 36
def MIN_SDK    = CFG.has('minSdkVersion')     ? (CFG.minSdkVersion as int)     : 28
def TARGET_SDK = CFG.has('targetSdkVersion')  ? (CFG.targetSdkVersion as int)  : COMPILE_SDK
def NDK_VER    = CFG.has('ndkVersion')        ? CFG.ndkVersion                  : null

// (opcional) bloque react
react { /* ... si lo usas ... */ }

// AHORA sí, el bloque android:
android {
  namespace "com.totalplaintextreader"
  compileSdk COMPILE_SDK
  if (NDK_VER) { ndkVersion NDK_VER }

  defaultConfig {
    applicationId "com.totalplaintextreader"
    minSdk MIN_SDK
    targetSdk TARGET_SDK
    versionCode 21
    versionName "2.1.0"
  }

  signingConfigs {
    release {
        storeFile file(MYAPP_UPLOAD_STORE_FILE)
        storePassword MYAPP_UPLOAD_STORE_PASSWORD
        keyAlias MYAPP_UPLOAD_KEY_ALIAS
        keyPassword MYAPP_UPLOAD_KEY_PASSWORD
    }
  }

  buildTypes {
    release {
        signingConfig signingConfigs.release
        minifyEnabled false
        shrinkResources false
    }
  }

  kotlinOptions { jvmTarget = '17' }
}

dependencies {
  // React Native (ya lo tendrás)
  implementation("com.facebook.react:react-android")
  if (hermesEnabled.toBoolean()) {
    implementation("com.facebook.react:hermes-android")
  } else {
    implementation "org.webkit:android-jsc:+"
  }

  // 👉 Necesario para Theme.AppCompat.*
  implementation("androidx.appcompat:appcompat:1.7.0")

  // (Opcional) si usas componentes Material o quieres Theme.Material3
  implementation("com.google.android.material:material:1.12.0")
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)
